<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - KES Carburant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    p {
      margin-bottom: 2rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .retry-icon {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Hors ligne</h1>
    <p>Vous n'êtes pas connecté à Internet.<br>Les données seront synchronisées automatiquement lorsque la connexion sera rétablie.</p>
    <button onclick="location.reload()">🔄 Réessayer</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(reg => {
        setInterval(() => {
          if (navigator.onLine) {
            location.reload();
          }
        }, 5000);
      });
    }
  </script>
</body>
</html>
